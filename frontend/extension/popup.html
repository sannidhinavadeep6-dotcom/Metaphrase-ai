<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metaphrase AI Quick Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 360px; padding: 16px; background: #f8fafc; color: #0f172a; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { font-size: 16px; font-weight: 800; color: #0284c7; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
    select, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 8px 12px; font-size: 13px; background: #ffffff; margin-bottom: 10px; outline: none; }
    textarea { height: 90px; resize: none; font-weight: 500; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { flex: 1; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; transition: 0.15s; }
    .btn-primary { background: #0f172a; color: #ffffff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-humanize { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .btn-humanize:hover { background: #fde68a; }
    .output-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 10px; font-size: 13px; color: #14532d; min-height: 80px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; font-weight: 500; display: none; }
    .copy-btn { margin-top: 8px; width: 100%; background: #e2e8f0; color: #334155; padding: 8px; font-size: 11px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>Metaphrase AI</span>
      <span class="badge">v3.0</span>
    </div>
  </div>

  <select id="toneSelect">
    <option value="Simple">Simple & Clear</option>
    <option value="Fluent" selected>Natural & Fluent</option>
    <option value="Academic">Academic & Formal</option>
    <option value="Executive">Executive & Concise</option>
  </select>

  <textarea id="inputText" placeholder="Paste or type text to transform..."></textarea>

  <div class="btn-row">
    <button id="transformBtn" class="btn-primary">Transform</button>
    <button id="humanizeBtn" class="btn-humanize">Humanize</button>
  </div>

  <div id="outputBox" class="output-box"></div>
  <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>

  <script src="popup.js"></script>
</body>
</html>
